# cargo-deny configuration — run by CI (audit.yml) and `cargo deny check` locally.
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# advisories fail the build on RustSec hits; licenses fail on anything outside the
# allow list below; sources fail on crates from unknown registries. bans stay at
# warn — duplicate versions are noisy, not dangerous, and a hard error would
# block unrelated PRs.

[advisories]
version = 2
# Unmaintained crates are a warning, not an error: the crate graph is large and
# "unmaintained" advisories regularly fire on transitive deps we cannot fix here.
unmaintained = "workspace"

[licenses]
version = 2
# Permissive set actually present in the tree (verified with `cargo deny check
# licenses`). Anything new lands as an error at PR time — add deliberately.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
