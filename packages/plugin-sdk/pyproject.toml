[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "opencapx-sdk"
version = "0.1.0"
description = "Python SDK for writing OpenCapX plugins (JSON-RPC 2.0 over stdio)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "OpenCapX" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# WHY: signing.py's Ed25519 signing/verification depends on cryptography; without this dependency the rest of the SDK still works.
dependencies = ["cryptography>=41"]

[tool.setuptools]
packages = ["opencapx_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]